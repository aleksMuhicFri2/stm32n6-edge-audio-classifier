general:
  project_name: stm32n6_hazard5v3s_yamnet1024_development
  logs_dir: logs
  saved_models_dir: saved_models
  global_seed: 120
  gpu_memory_limit: 6
  display_figures: false
  deterministic_ops: true

operation_mode: chain_tqe

model:
  model_name: yamnet_e1024
  input_shape: [64, 96, 1]
  pretrained: true

dataset:
  dataset_name: custom
  class_names:
    - dog_bark
    - glass_breaking
    - gunshot_gunfire
    - siren
    - speech
    - thunderstorm
  file_extension: .wav
  training_audio_path: ../../datasets/hazard5v3s/audio
  training_csv_path: ../../datasets/hazard5v3s/meta/hazard6_train.csv
  validation_audio_path: ../../datasets/hazard5v3s/audio
  validation_csv_path: ../../datasets/hazard5v3s/meta/hazard6_validation.csv
  test_audio_path: ../../datasets/hazard5v3s/audio
  test_csv_path: ../../datasets/hazard5v3s/meta/hazard6_development_test.csv
  quantization_audio_path: ../../datasets/hazard5v3s/audio
  quantization_csv_path: ../../datasets/hazard5v3s/meta/hazard6_quantization.csv
  quantization_split: 1.0
  multi_label: false
  use_garbage_class: false
  n_samples_per_garbage_class: 2
  expand_last_dim: true
  seed: 120
  to_cache: false
  shuffle: true

preprocessing:
  min_length: 1
  max_length: 10
  target_rate: 16000
  top_db: 60
  frame_length: 3200
  hop_length: 3200
  trim_last_second: false
  lengthen: after

feature_extraction:
  patch_length: 96
  n_mels: 64
  overlap: 0.25
  n_fft: 512
  hop_length: 160
  window_length: 400
  window: hann
  center: false
  pad_mode: constant
  power: 1.0
  fmin: 125
  fmax: 7500
  norm: null
  htk: true
  to_db: false
  include_last_patch: false

data_augmentation:
  GaussianNoise:
    enable: true
    scale: 0.1
  VolumeAugment:
    enable: true
    min_scale: 0.8
    max_scale: 1.2
  SpecAug:
    enable: false
    freq_mask_param: 1
    time_mask_param: 1
    n_freq_mask: 3
    n_time_mask: 4
    mask_value: 0

training:
  fine_tune: false
  dropout: 0.0
  batch_size: 16
  epochs: 60
  resume_training: null
  optimizer:
    Adam:
      learning_rate: 0.001
  callbacks:
    ReduceLROnPlateau:
      monitor: val_accuracy
      mode: max
      factor: 0.5
      patience: 5
      min_lr: 0.00001
    EarlyStopping:
      monitor: val_accuracy
      mode: max
      restore_best_weights: true
      patience: 12

# ST's reference YAMNet-1024 workflow uses per-channel QDQ ONNX
# post-training quantization. This is intentionally different from the
# TensorFlow Lite converter used by the YAMNet-256 baseline.
quantization:
  quantizer: onnx_quantizer
  quantization_type: PTQ
  quantization_input_type: int8
  quantization_output_type: float
  granularity: per_channel
  target_opset: 17
  onnx_quant_parameters:
    op_types_to_quantize:
      - Conv
      - Relu
      - Squeeze
      - GlobalAveragePool
      - Gemm
      - Transpose
  onnx_extra_options:
    CalibMovingAverage: true
  export_dir: quantized_models

evaluation:
  target: host

mlflow:
  uri: ../../training-runs/mlruns

hydra:
  run:
    dir: ../../training-runs/hazard5v3s_yamnet1024/${now:%Y_%m_%d_%H_%M_%S}
