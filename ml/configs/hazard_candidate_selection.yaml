general:
  experiment_id: HAZARD-CANDIDATE-SELECTION-001
  seed: 120
  target_count: 5
  purpose: Select five acoustically distinct danger events before final training.

provisional_offline_selection:
  status: pending_board_and_hard_negative_validation
  classes:
    - siren
    - chainsaw
    - gunshot_gunfire
    - screaming
    - thunderstorm
  excluded:
    crackling_fire: Strong centroid overlap with thunderstorm and lower seven-class recall.
    glass_breaking: Lower seven-class recall and confusion with crackling fire and gunshot.
    fire_alarm: No direct leaf-class source in the audited ESC-50 and FSD50K datasets.
  evidence_directory: experiments/results/hazard_candidate_selection/provisional_final5_dev

scoring:
  board_playback_recall: 0.35
  inter_danger_separation: 0.25
  hard_negative_resistance: 0.20
  offline_test_performance: 0.10
  confidence_latency_stability: 0.10

candidates:
  - class_name: siren
    display_name: Emergency siren
    acoustic_family: modulated_tonal
    esc50_label: siren
    fsd50k_label: Siren
  - class_name: chainsaw
    display_name: Chainsaw
    acoustic_family: continuous_mechanical
    esc50_label: chainsaw
    fsd50k_label: null
  - class_name: glass_breaking
    display_name: Glass breaking
    acoustic_family: brittle_transient
    esc50_label: glass_breaking
    fsd50k_label: Glass
  - class_name: screaming
    display_name: Human screaming
    acoustic_family: voiced_distress
    esc50_label: null
    fsd50k_label: Screaming
  - class_name: gunshot_gunfire
    display_name: Gunshot or gunfire
    acoustic_family: explosive_impulse
    esc50_label: null
    fsd50k_label: Gunshot_and_gunfire
  - class_name: fire_alarm
    display_name: Fire alarm
    acoustic_family: periodic_alarm
    esc50_label: null
    fsd50k_label: null
  - class_name: thunderstorm
    display_name: Thunderstorm
    acoustic_family: environmental_rumble
    esc50_label: thunderstorm
    fsd50k_label: Thunderstorm
  - class_name: crackling_fire
    display_name: Crackling fire
    acoustic_family: stochastic_crackle
    esc50_label: crackling_fire
    fsd50k_label: Fire

selection_gates:
  minimum_offline_recall: 0.85
  maximum_pairwise_confusion: 0.15
  minimum_board_playback_recall: 0.80
  maximum_hard_negative_trigger_rate: 0.10

sources:
  esc50:
    url: https://github.com/karolpiczak/esc-50
    protocol: folds 1-3 train; fold 4 validation; fold 5 reserved test
  fsd50k:
    url: https://zenodo.org/records/4060432
    protocol: official development train/validation; evaluation reserved test
  yamnet:
    url: https://github.com/tensorflow/models/tree/master/research/audioset/yamnet
    purpose: pretrained 256-dimensional embedding backbone
